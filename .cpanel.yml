
# .cpanel.yml
version: 2

deployment:
	tasks:
		- echo "Iniciando despliegue en cPanel"
		- export DOCROOT=public_html
		- echo "Directorio público: $DOCROOT"
		- rsync -av --exclude='.git' --exclude='.cpanel.yml' --delete ./ $HOME/$DOCROOT/

hooks:
	predeploy:
		- echo "Hook predeploy: puedes añadir comandos antes del despliegue"
	postdeploy:
		- echo "Hook postdeploy: limpieza o notificaciones después del despliegue"

# Fin de .cpanel.yml
