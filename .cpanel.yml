---
deployment:
  tasks:
    - echo "Iniciando despliegue en cPanel"
    - export DOCROOT=dev.ecommetrica.com
    - export DEPLOYPATH=$PWD
    - echo "Directorio público: $DOCROOT"
    - echo "Instalando dependencias"
    - npm ci
    - echo "Generando export estático (carpeta out/)"
    - npm run build
    - echo "Sincronizando solo out/ hacia $DOCROOT"
    - rsync -av --delete $DEPLOYPATH/out/ $HOME/$DOCROOT/
